<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="csrf-token" content="harness-csrf-token">
<title>PO layout picker harness</title>
<!--
  NOT a product page. A standalone stand-in for purchase_orders/print_preprinted.html,
  used by tests/e2e/test_po_layout_picker.py to drive the named-layout picker wiring
  in app/static/js/preprinted_designer.js on its own. Same shape as
  _preprinted_designer_harness.html (which this file's canvas/toolbar markup is
  copied from), plus the #ppLayoutPicker toolbar the real template renders inside
  its `can_edit_layout` block once print_layouts rows exist for the PO's branch.

  It deliberately does NOT call initPreprintedDesigner -- the test calls it with the
  layoutPicker config (including the made-up save-as/rename/delete/select paths) it
  wants to exercise.

  The two <option>s' data-payload JSON is what a real PrintLayout.payload column
  holds (app/print_layouts/models.py) -- the exact shape preprinted_base.sanitize_layout
  produces. "Default" (value=1) matches this canvas's own starting geometry;
  "Purchasing - HP LaserJet" (value=2) is a deliberately DIFFERENT layout so a test
  can tell whether picking it actually repainted the canvas.
-->
<link rel="stylesheet" href="/app/static/css/preprinted_designer.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Courier New", Courier, monospace; color: #111; background: #eee; }
  .pp-canvas { position: relative; margin: 8px auto; background: #fff; }
  .pp-el { position: absolute; white-space: nowrap; }
  .pp-lineitems { white-space: normal; }
  .pp-col { position: absolute; }
  .pp-cell { overflow: hidden; white-space: nowrap; }
  .pp-col-hidden { display: none; }
  .pp-field-hidden { display: none; }
  .pp-canvas.pp-editing .pp-field-hidden { display: block; opacity: .4; }
  .pp-col-controls { max-width: 912px; margin: 0 auto; display: none; flex-wrap: wrap; gap: 12px; font-size: 12px; align-items: center; }
  .pp-col-controls.pp-show { display: flex; }
  .pp-toolbar { max-width: 912px; margin: 0 auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .btn { padding: 4px 10px; font-size: 13px; cursor: pointer; }
</style>
<style id="ppPageStyle">@page { size: 9.5in 10.5in; margin: 0; }</style>
</head>
<body data-can-edit="true" data-paper="continuous">

<div class="pp-toolbar screen-only">
  <button type="button" class="btn btn-print">Print</button>
  <button type="button" id="editLayoutBtn" class="btn btn-edit">Edit Layout</button>
  <select id="ppPaper" style="display:none;">
    <option value="continuous" data-w="912" data-h="1008" data-css="9.5in 10.5in" selected>9.5 x 10.5 continuous paper</option>
    <option value="letter" data-w="816" data-h="1056" data-css="8.5in 11in">Letter 8.5 x 11</option>
  </select>
  <select id="ppFontFamily" style="display:none;">
    <option value="&quot;Courier New&quot;, Courier, monospace" selected>Courier New</option>
    <option value="Georgia, serif">Georgia</option>
  </select>
  <select id="ppDateFormat" style="display:none;" title="Date format">
    <option value="long" selected>15 August 2026</option>
    <option value="us">08/15/2026</option>
  </select>

  <span class="pp-layout-picker">
    Editing:
    <select id="ppLayoutPicker">
      <option value="1" selected data-payload='{"paper":"continuous","dateFormat":"long","page":{"fontFamily":"\"Courier New\", Courier, monospace"},"fields":{"vendor_name":{"x":60,"y":50,"w":500,"fontSize":12,"bold":true,"hidden":false},"po_no":{"x":620,"y":50,"w":200,"fontSize":12,"bold":true,"hidden":false},"order_date":{"x":620,"y":74,"w":200,"fontSize":11,"bold":false,"hidden":false}},"lineItems":{"y":300,"rowHeight":20,"fontSize":10,"bold":false,"columns":[{"key":"product","x":120,"visible":true,"width":260},{"key":"amount","x":700,"visible":true,"width":120}]},"extras":[],"texts":[{"id":"preparer","text":"Preparer","x":60,"y":720,"fontSize":10,"bold":false,"hidden":false}]}'>Default</option>
      <option value="2" data-payload='{"paper":"continuous","dateFormat":"us","page":{"fontFamily":"\"Courier New\", Courier, monospace"},"fields":{"vendor_name":{"x":90,"y":90,"w":480,"fontSize":13,"bold":true,"hidden":false},"po_no":{"x":640,"y":110,"w":180,"fontSize":13,"bold":true,"hidden":false},"order_date":{"x":640,"y":134,"w":180,"fontSize":12,"bold":false,"hidden":true}},"lineItems":{"y":340,"rowHeight":22,"fontSize":11,"bold":false,"columns":[{"key":"product","x":140,"visible":true,"width":240},{"key":"amount","x":720,"visible":false,"width":100}]},"extras":[],"texts":[{"id":"preparer","text":"Preparer","x":80,"y":740,"fontSize":10,"bold":false,"hidden":false}]}'>Purchasing - HP LaserJet</option>
    </select>
    <button type="button" id="ppSaveAsBtn" class="btn btn-edit">Save as&hellip;</button>
    <button type="button" id="ppRenameBtn" class="btn btn-edit">Rename</button>
    <button type="button" id="ppDeleteLayoutBtn" class="btn btn-edit">Delete</button>
  </span>
  <span class="pp-device-layout">
    This workstation uses: <strong id="ppDeviceLayout" data-layout-id="1">Default</strong>
    <button type="button" id="ppUseHereBtn" class="btn btn-edit">Use on this workstation</button>
  </span>
</div>

<div id="ppFieldControls" class="pp-col-controls screen-only"></div>
<div id="ppColControls" class="pp-col-controls screen-only"></div>

<div class="pp-canvas" id="ppCanvas" style="width:912px;height:1008px;">
  <div class="pp-el" data-el="vendor_name" data-label="Vendor"
       style="left:60px;top:50px;width:500px;font-size:12px;font-weight:bold;">Alpha Trading Inc</div>
  <div class="pp-el" data-el="po_no" data-label="PO No."
       style="left:620px;top:50px;width:200px;font-size:12px;font-weight:bold;">PO-2026-0001</div>
  <div class="pp-el" data-el="order_date" data-label="Order Date" data-date="2026-08-15"
       style="left:620px;top:74px;width:200px;font-size:11px;font-weight:normal;">15 August 2026</div>
  <div class="pp-el pp-text" data-text="preparer" data-label="Preparer" data-signatory="1"
       style="left:60px;top:720px;font-size:10px;font-weight:normal;">Preparer</div>

  <div class="pp-lineitems" data-el="lineItems" data-rowheight="20">
    <div class="pp-col" data-col="product" data-label="Product"
         style="left:120px;top:300px;width:260px;font-size:10px;font-weight:normal;">
      <div class="pp-cell" style="height:20px;line-height:20px;">P-001 Widget</div>
    </div>
    <div class="pp-col" data-col="amount" data-label="Amount"
         style="left:700px;top:300px;width:120px;font-size:10px;font-weight:normal;">
      <div class="pp-cell" style="height:20px;line-height:20px;">1,250.00</div>
    </div>
  </div>
</div>

<script src="/app/static/js/preprinted_designer.js"></script>
</body>
</html>
